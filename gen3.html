<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>POKEGUESSER - Gen 3</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="audio-controls">
        <button id="btn-mute">🔇 Musique OFF</button>
        <audio id="bg-music" src="musique.mp3" loop></audio>
    </div>

    <div id="menu-container">
        <button class="dropbtn">Générations ▼</button>
        <div id="menu-generations" class="dropdown-content">
            <a href="index.html" class="btn-gen">
                <img src="red.jpeg" alt="Red"> Génération 1
            </a>
            <a href="gen2.html" class="btn-gen">
                <img src="gold.jpeg" alt="Gold"> Génération 2
            </a>
            <a href="gen3.html" class="btn-gen actif">
                <img src="brandon.jpeg" alt="Brandon"> Génération 3
            </a>
        </div>
    </div>

    <header>
        <img src="logo.jpeg" alt="Logo du site" id="mascotte">
        <h1>POKEGUESSER</h1>
    </header>

    <main>
        <div id="score-container">
            Score : <span id="score">0</span> / 135
            <button id="btn-reset">🔄 Réinitialiser</button>
        </div>

        <input type="text" id="saisie" placeholder="Tapez un nom de Pokémon...">
        <div id="pokedex-grid"></div>
    </main>

    <footer>
        Créé par Tomilitovic
    </footer>

    <script src="script-gen3.js"></script>
</body>
</html>
