<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>POKEGUESSER - Pokédex National</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="audio-controls">
        <button id="btn-mute">🔇 Musique OFF</button>
        <audio id="bg-music" src="musique.mp3" loop></audio>
    </div>
    
    <div id="menu-container">
        <button class="dropbtn">Générations ▼</button>
        <div id="menu-generations" class="dropdown-content">
            <a href="index.html" class="btn-gen">Génération 1</a>
            <a href="gen2.html" class="btn-gen">Génération 2</a>
            <a href="gen3.html" class="btn-gen">Génération 3</a>
            <a href="gen4.html" class="btn-gen">Génération 4</a>
            <a href="gen5.html" class="btn-gen">Génération 5</a>
            <a href="gen6.html" class="btn-gen">Génération 6</a>
            <a href="gen7.html" class="btn-gen">Génération 7</a>
            <a href="gen8.html" class="btn-gen">Génération 8</a>
            <a href="gen9.html" class="btn-gen">Génération 9</a>
            <!-- Le nouveau bouton pour le 100% -->
            <a href="gen-all.html" class="btn-gen actif">Le Pokédex Entier (1025)</a>
        </div>
    </div>
    
    <header>
        <img src="logo.jpeg" alt="Logo du site" id="mascotte">
        <img src="pokeguesser.png" alt="Titre Pokeguesser" id="titre-jeu">
    </header>
    
    <main>
        <div id="timer-container">⏱️ <span id="timer">00:00</span></div>
        <div id="score-container">
            Score : <span id="score">0</span> / 1025
            <button id="btn-reset">🔄 Réinitialiser</button>
        </div>
        
        <input type="text" id="saisie" placeholder="Tapez un nom de Pokémon...">
        <!-- C'est ici que le JavaScript va injecter les 9 grands blocs -->
        <div id="pokedex-grid"></div>
    </main>
    
    <footer>Créé par Tomilitovic</footer>
    
    <script src="script-all.js"></script>
</body>
</html>
