<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>POKEGUESSER - Spéciaux</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="audio-controls">
        <button id="btn-mute">🔇 Musique OFF</button>
        <audio id="bg-music" src="musique3.mp3" loop></audio> 
    </div>
    
    <div id="top-nav">
        <div class="menu-container">
            <button class="dropbtn">Générations ▼</button>
            <div class="dropdown-content">
                <a href="index.html" class="btn-gen">Génération 1</a>
                <a href="gen2.html" class="btn-gen">Génération 2</a>
                <!-- Autres générations... -->
                <a href="gen-all.html" class="btn-gen">Le Pokédex Entier (1025)</a>
            </div>
        </div>
        <a href="type.html" class="btn-onglet">Par Type 🌟</a>
        <a href="speciaux.html" class="btn-onglet actif">Spéciaux 🏆</a>
        <a href="dresseurs.html" class="btn-onglet">Dresseurs ⚔️</a>
        <a href="donjon.html" class="btn-onglet">Personnalité 🔮</a>
    </div>
    
    <header>
        <img src="logo.jpeg" alt="Logo du site" id="mascotte">
        <img src="pokeguesser.png" alt="Titre Pokeguesser" id="titre-jeu">
    </header>
    
    <main>
        <div id="special-menu"></div>
        <h1 id="titre-dynamique" style="display: none;"></h1>
        
        <div id="timer-container" style="display: none;">⏱ <span id="timer">00:00</span></div>
        <div id="score-container" style="display: none;">
            Score : <span id="score">0</span> / <span id="score-max">0</span>
            <button id="btn-reset" class="btn-action">🔄 Recommencer</button>
            <button id="btn-ombre" class="btn-action">👤 Afficher l'ombre</button>
            <button id="btn-abandon" class="btn-action">🏳️ Abandonner</button>
            <button id="btn-retour-modes" class="btn-action">🔙 Changer de Mode</button>
        </div>
        
        <input type="text" id="saisie" placeholder="Choisissez un mode spécial au-dessus..." disabled>
        
        <!-- Le conteneur Blind Test qui s'affiche via JS -->
        <div id="container-bt" style="display:none;">
             <h2 style="color:#2c3e50;">Écoute le cri et devine le Pokémon !</h2>
             <h3 style="color:#e74c3c;">Score : <span id="bt-score">0</span></h3>
             <button id="btn-play-sound" class="btn-action">▶️ ÉCOUTER</button>
             <input type="text" id="saisie-bt" placeholder="Qui est-ce ?">
             <div id="bt-resultat"></div>
             <button id="btn-retour-speciaux-bt" class="btn-action">🔙 Retour</button>
        </div>

        <div id="pokedex-grid"></div>
    </main>
    
    <footer>Créé par Tomilitovic</footer>
    <script src="script-speciaux.js"></script>
</body>
</html>
