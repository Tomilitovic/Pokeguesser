<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>POKEGUESSER - Par Type</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="audio-controls">
        <button id="btn-mute">🔇 Musique OFF</button>
        <audio id="bg-music" src="musique2.mp3" loop></audio>
    </div>
    
    <!-- LES DEUX ONGLETS SÉPARÉS -->
    <div id="menu-wrapper">
        <div class="menu-container">
            <button class="dropbtn">Générations ▼</button>
            <div class="dropdown-content">
                <a href="index.html" class="btn-gen">Génération 1</a>
                <a href="gen2.html" class="btn-gen">Génération 2</a>
                <a href="gen3.html" class="btn-gen">Génération 3</a>
                <a href="gen4.html" class="btn-gen">Génération 4</a>
                <a href="gen5.html" class="btn-gen">Génération 5</a>
                <a href="gen6.html" class="btn-gen">Génération 6</a>
                <a href="gen7.html" class="btn-gen">Génération 7</a>
                <a href="gen8.html" class="btn-gen">Génération 8</a>
                <a href="gen9.html" class="btn-gen">Génération 9</a>
                <a href="gen-all.html" class="btn-gen">Le Pokédex Entier (1025)</a>
            </div>
        </div>

        <div class="menu-container">
            <!-- L'onglet TYPES est jaune et actif ici -->
            <button class="dropbtn actif">Par Type ▼</button>
            <div class="dropdown-content">
                <a href="type.html" class="btn-gen">Menu principal des Types</a>
            </div>
        </div>
    </div>
    
    <header>
        <img src="logo.jpeg" alt="Logo du site" id="mascotte">
        <img src="pokeguesser.png" alt="Titre Pokeguesser" id="titre-jeu">
    </header>
    
    <main>
        <!-- Grille des 18 gros logos de types -->
        <div id="type-menu"></div>
        
        <!-- Le titre dynamique qui s'affiche quand on choisit un type -->
        <h1 id="titre-type-choisi"></h1>

        <div id="timer-container" style="display: none;">⏱ <span id="timer">00:00</span></div>
        <div id="score-container" style="display: none;">
            Score : <span id="score">0</span> / <span id="score-max">0</span>
            <button id="btn-reset" class="btn-action">🔄 Recommencer</button>
            <button id="btn-ombre" class="btn-action">👤 Afficher l'ombre</button>
            <button id="btn-abandon" class="btn-action">🏳️ Abandonner</button>
            <!-- Bouton pour cacher la grille et réafficher le menu des types -->
            <button id="btn-retour-types" class="btn-action">🔙 Changer de Type</button>
        </div>
        
        <input type="text" id="saisie" placeholder="Choisissez un type au-dessus pour commencer..." disabled>
        
        <!-- La grille compacte des Pokémon par génération -->
        <div id="pokedex-grid"></div>
    </main>
    
    <footer>Créé par Tomilitovic</footer>
    <script src="script-type.js"></script>
</body>
</html>
